- id: hist-prokopovych-frame-hive
  kind: fact
  lang: en
  gist: "Petro Prokopovych (1775-1850), Ukrainian, built the world's first frame hive in 1814, so honey could be taken without killing the colony. Before that the usual way was to kill the bees with smoke. He also made an early queen excluder, had 580 hives by 1808 and 6,600 colonies later, and ran a beekeeping school that trained 700+ beekeepers over 53 years. Langstroth's US patent came only in 1852."
  season: any (pilot or 'Wie alles anfing' fits)
  source: {title: "en.wikipedia: Petro Prokopovych; Beehive", url: "https://en.wikipedia.org/wiki/Petro_Prokopovych"}
  rights: paraphrase-only
  it_parallel: "A Ukrainian beekeeper invented 'non-destructive updates' 38 years before the Americans patented them."
  gag_seed: "Pylyp to a German recruiter: 'Relevant experience? A Ukrainian beekeeper shipped the frame hive in 1814. We've been doing zero-downtime deploys for 200 years.'"
  characters: [pylyp]
  status: raw
  note: "24tv.ua claims Tsar Nicholas I came to taste his honey and Shevchenko visited in 1843: single popular source, check before use."

- id: hist-skep-sulfur
  kind: fact
  lang: en
  gist: "Straw skeps were used for about 2,000 years; the harvest often killed the colony, sometimes with burning sulfur. As of 1998 most US states banned skeps and other hives that cannot be inspected."
  season: autumn
  source: {title: "en.wikipedia: Beehive", url: "https://en.wikipedia.org/wiki/Beehive"}
  rights: paraphrase-only
  it_parallel: "Legacy system: works, but every release deletes the database."
  gag_seed: "Bzynka on legacy code: 'Skep architecture. Every update kills everyone.'"
  characters: [bzynka]
  status: raw

