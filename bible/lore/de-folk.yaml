  status: raw

- id: de-proverb-four-things
  kind: proverb
  lang: de
  text: "Vier Dinge muss der Imker haben, will er Erfolge schauen: Geduld, Verstand, treue Liebe und Selbstvertrauen."
  gist: "A beekeeper needs four things for success: patience, sense, faithful love and self-confidence."
  season: any
  source: {title: "LWG", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
  rights: public-domain
  it_parallel: "The same list is the job ad for an automation engineer."
  gag_seed: "Pylyp reads a Stellenanzeige, then the Imker rhyme: 'Same skills, fewer stings.'"
  characters: [pylyp]
  status: raw

