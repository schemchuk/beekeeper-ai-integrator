- id: de-tale-eulenspiegel-hive
  kind: tale
  lang: de
  gist: "Drunk Till Eulenspiegel sleeps in an empty hive; two thieves steal the heaviest hive (him), he pulls their hair in the dark until they fight each other and run off."
  season: summer
  source: {title: "LWG (Eulenspiegel, 1510/1515)", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
  rights: public-domain
  it_parallel: "Thieves' heuristic 'the heaviest is the best' = picking the biggest file to exfiltrate. Honeypot, literally."
  gag_seed: "Pylyp builds a honeypot: an empty hive with Сірий inside."
  characters: [siryi, pylyp]
  status: raw

- id: de-law-bgb-swarm
  kind: law
  lang: de
  gist: "BGB §§ 961-964 (in force since 1900): a swarm becomes ownerless unless the owner pursues it at once; the owner may enter other people's land in pursuit and break open a foreign empty hive (paying damages); merged swarms become co-owned in proportion; a swarm that moves into an occupied foreign hive belongs to that hive's owner."
  season: spring (swarming)
  source: {title: "Bürgerliches Gesetzbuch § 961-964", url: "https://www.gesetze-im-internet.de/bgb/__961.html"}
  rights: public-domain
  it_parallel: "German law has a merge-conflict resolution policy for bees. § 963 is a git merge."
  gag_seed: "Pylyp chases a swarm across a German neighbour's garden shouting '§ 962 BGB!' Perfect for the DE audience."
  characters: [pylyp, bzynka]
  status: raw

- id: de-zeidler-privileges
  kind: fact
  lang: de
  gist: "Zeidler, forest beekeepers of the Nuremberg Reichswald ('the bee garden of the Holy Roman Empire'). Charles IV's charter of 1 June 1350 gave them their own court and the right to carry a crossbow; they wore green with a long pointed cap. Zeidelgericht in Feucht from 1296, last session 1779. Their honey fed Nuremberg Lebkuchen."
  season: "any (Christmas fits, Lebkuchen)"
  source: {title: "de.wikipedia: Zeidlerei", url: "https://de.wikipedia.org/wiki/Zeidlerei"}
  rights: paraphrase-only
  it_parallel: "Beekeepers with their own court and weapons: the first privileged admin role."
  gag_seed: "Pylyp asks the Jobcenter for Zeidler status: own court, crossbow, toll-free in all Reich cities."
  characters: [pylyp]
  status: raw

- id: de-custom-telling-bees
  kind: custom
  lang: de
  gist: "Telling the bees: in Westphalia newlyweds introduced themselves to the bees, or their marriage would be unhappy. A German saying for a dead beekeeper: 'Little bee, our lord is dead; leave me not in my distress' (German original not yet found)."
  season: any
  source: {title: "en.wikipedia: Telling the bees", url: "https://en.wikipedia.org/wiki/Telling_the_bees"}
  rights: paraphrase-only
  it_parallel: "Change notification to all stakeholders, including the ones that sting."
  gag_seed: "Pylyp onboards a new colleague by introducing him to the bees first."
  characters: [pylyp, bzynka]
  status: raw
