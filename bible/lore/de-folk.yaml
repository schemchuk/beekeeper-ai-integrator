  status: raw

- id: de-proverb-sticky-fingers
  kind: proverb
  lang: de
  text: "Wer mit Honig umgeht, dem bleibt auch etwas an den Fingern hängen."
  gist: "Whoever handles honey gets some stuck on his fingers (also in Goethe's Reineke Fuchs)."
  season: any
  source: {title: "LWG", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
  rights: public-domain
  it_parallel: "Whoever handles data keeps logs. GDPR joke."
  gag_seed: "Medunko's paws on the keyboard: every key is sticky."
  characters: [medunko]
  status: raw

- id: de-proverb-flies-come
  kind: proverb
  lang: de
  text: "Ist nur Honig da, die Fliegen kommen von selber."
  gist: "If there is honey, the flies come by themselves."
  season: any
  source: {title: "LWG", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
