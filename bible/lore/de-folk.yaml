# German bee and beekeeper lore. Format: see README.md.
# Main source: Bayerische Landesanstalt für Weinbau und Gartenbau (LWG),
# "Bienen im Deutschunterricht", 2011:
# https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf
# The proverbs, the Lorsch blessing, Eulenspiegel and Grimm are public domain; the LWG
# collection is our finding aid.

- id: de-lorsch-bee-blessing
  kind: spell
  lang: de
  text: "Kirst, die Imme ist herausen! Nun flieg her, mein Tier! … Sitze, sitze, Biene! … Urlaub nicht hast du, zum Wald nicht flieg' du!"
  gist: "Lorsch bee blessing, 10th century, one of the oldest German texts: a charm to make a swarm settle. Manuscript in the Vatican."
  season: spring (swarming, May-June)
  source: {title: "LWG, Bienen im Deutschunterricht", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
  rights: public-domain
  it_parallel: "'Urlaub nicht hast du': the first documented holiday ban in German HR history."
  gag_seed: "Bzynka asks for a day off; Pylyp reads her the Lorscher Bienensegen. DE audience will get it."
  characters: [bzynka, pylyp]
  status: raw

- id: de-proverb-bear-guards
  kind: proverb
  lang: de
  text: "Es ist um den Honig geschehen, wenn der Bär ihn hütet."
  gist: "The honey is done for when the bear guards it."
  season: any
  source: {title: "LWG, Bienen im Deutschunterricht", url: "https://www.lwg.bayern.de/mam/cms06/bienen/dateien/bienen_im_deutschunterricht.pdf"}
  rights: public-domain
  it_parallel: "Never give admin rights to the user who wants the data most."
  gag_seed: "Medunko volunteers as 'security for the honey storage'. Pylyp quotes the proverb. See lit-hlibov-bear-beekeeper."
  characters: [medunko, pylyp]
  status: raw

- id: de-proverb-run-from-bees
  kind: proverb
  lang: de
  text: "Wer vor den Bienen läuft, den verfolgen sie."
