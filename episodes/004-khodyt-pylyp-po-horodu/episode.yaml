# Episode 004: Ходить Пилип по городу / Philipp geht durch den Garten
# Draft v2, 2026-11-28, from idea 13 (bible/ideas.md, story 2026-11-27-telegram-810669362).
# A play on the folk song "Ходить гарбуз по городу": Pylyp asks his kin whether all are
# alive and well; the kin read and keep silent, only the bees answer (Wi-Fi hives).
# IT pain: chasing status by asking ("Wie ist der Stand?") instead of systems reporting themselves.
# Season: early winter, the hive is closed, contact "по вай-фаю"; Isegrim visits in the evening.
# Slot: Tuesday 2026-12-01 08:00 Europe/Berlin. Waits for Volodymyr's edits.
id: "004"
slug: khodyt-pylyp-po-horodu
season: winter
target_length: 40-50 s
release: "2026-12-01T08:00:00+01:00"
title:
  ua: "Ходить Пилип по городу"
  de: "Philipp geht durch den Garten"
seed: "Idea 13 (bible/ideas.md): Pylyp asks his kin if all are alive and well, only his bees answer; source bible/stories/2026-11-27-telegram-810669362.md"

cover:
