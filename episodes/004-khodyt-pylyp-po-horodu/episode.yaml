  monitor:
    ua: "«Який статус?»\nПрочитано. Тиша."
    de: "„Wie ist der Stand?“\nGelesen. Stille."

post:
  hook:
    ua: "«Який статус?» Прочитали дванадцятеро, не відповів ніхто. А бджоли у зимовому вулику звітують самі."
    de: "„Wie ist der Stand?“ Zwölf haben es gelesen, keiner antwortet. Die Bienen im Winterstock melden sich von selbst."
  grain:
    ua: "Не збирайте статус питаннями. Хай кожна система чи задача сама шле короткий сигнал: працює, готово, застрягло. Дашборд покаже тишу раніше, ніж ви встигнете спитати."
    de: "Status nicht per Nachfrage einsammeln. Jedes System und jede Aufgabe meldet selbst ein kurzes Signal: läuft, fertig, hängt. Das Dashboard zeigt die Stille, bevor Sie fragen müssen."
  question:
    ua: "Скільки разів на тиждень ви пишете «Який статус», а відповіді так і не дочікуєтесь?"
    de: "Wie oft pro Woche schreiben Sie „Wie ist der Stand“ und warten dann vergeblich?"
  offer:
    ua: "Статус-запити, що з'їдають тиждень? Напишіть мені, я подивлюсь."
    de: "Statusabfragen, die Ihre Woche fressen? Schreiben Sie mir, ich schaue es mir an."
  hashtags: [Automatisierung, Monitoring, Python, Mittelstand]

# Shots are hints for the animation; the voice lines drive the timing.
scenes:
  hut: "Pylyp's hut on a winter evening, snow outside, the snowy apiary seen through the window, laptop with a chat and a hive dashboard, a teapot with herbal tea on the table"

