<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 680 420" role="img"><title>Tired cyberpunk beekeeper</title><desc>A weary beekeeper in a veiled hat with a cyber monocle stares at buggy code on a monitor at night while rain falls outside and a small bee hovers nearby.</desc>
<style>
.ln{transform-box:fill-box;transform-origin:0 50%;animation:ty 5s ease-in-out infinite}
.cur{animation:bl 1s steps(1) infinite}
.rn{animation:rain 1.1s linear infinite}
.rn2{animation:rain 1.6s linear infinite}
.bob{animation:bob 3s ease-in-out infinite}
.nod{transform-origin:218px 196px;animation:nod 6s ease-in-out infinite}
.st{animation:steam 3s ease-in infinite}
.wg{transform-box:fill-box;transform-origin:50% 100%;animation:fl .15s linear infinite}
.er{animation:err 1.4s ease-in-out infinite}
.mo{animation:bl 2.4s steps(1) infinite}
@keyframes ty{0%,8%{transform:scaleX(0)}30%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rain{from{transform:translate(0,-60px)}to{transform:translate(-20px,70px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-8px)}}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
@keyframes err{0%,100%{opacity:.15}50%{opacity:.4}}
</style>
