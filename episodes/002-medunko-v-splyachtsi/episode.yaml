# Episode 002: Медунко в сплячці / Medunko im Winterschlaf
# Draft v2, 2026-11-25 (Volodymyr's edits, T09). v1 2026-11-24. Season: winter (bears hibernate, the apiary is closed).
id: "002"
slug: medunko-v-splyachtsi
season: winter
target_length: 35-40 s
title:
  ua: "Медунко в сплячці"
  de: "Medunko im Winterschlaf"

# Cover and post (reach rules, 2026-11-26) added after 002 was published, as the example for
# 003 on; the published 002 reel stays as it is. Draft text, waits for Volodymyr's edits.
cover:
  who: [pylyp, medunko]
  monitor:
    ua: "Ваш запит\nзбережено."
    de: "Ihre Anfrage wurde\ngespeichert."

post:
  hook:
    ua: "03:12, і він знову пише. Скільки однакових листів ви відповідаєте вручну щотижня?"
    de: "03:12 Uhr, er schreibt schon wieder. Wie viele gleiche Anfragen beantworten Sie jede Woche von Hand?"
  grain:
    ua: "Бот, який чемно відповідає на однаковий запит і зберігає його на потім, це кілька десятків рядків Python. Решта ночі ваша."
    de: "Ein Bot, der dieselbe Anfrage freundlich beantwortet und für später speichert, sind ein paar Dutzend Zeilen Python. Der Rest der Nacht gehört Ihnen."
  question:
    ua: "Яку рутину ви першою віддали б ботові?"
    de: "Welche Routine würden Sie zuerst einem Bot geben?"
  offer:
    ua: "Повторювані задачі в команді? Напишіть мені, я подивлюсь."
    de: "Wiederkehrende Aufgaben im Team? Schreiben Sie mir, ich schaue es mir an."
  hashtags: [Automatisierung, KI, Python, Mittelstand]

# Shots are hints for the animation; the voice lines drive the timing.
scenes:
  hut: "Pylyp's hut at night, snow outside the window, laptop glowing, phone on the table"
  den: "Bear's den under snow, Medunko asleep in his nightcap, sucking one paw, phone in the other"

lines:
  - shot: {scene: hut, camera: phone close-up, at: hook}
    onscreen: {ua: "03:12  Медунко: Добрий день 🐻", de: "03:12  Medunko: Guten Tag 🐻"}
    sfx: phone-buzz
    action: "Phone lights up and buzzes across the table. Hook: works without sound."

  - who: pylyp
    shot: {scene: hut, camera: medium, action: "jolts up from the pillow, monocle askew"}
    ua: "Медунку, ти [бзз] знаєш, котра година? Ти ж у сплячці!"
    de: "Medunko, weißt du [bzz], wie spät es ist? Du hältst Winterschlaf!"
    note: "[бзз] = Бзинька's bleep over a swear word, the only one in the episode"

  - who: medunko
    shot: {scene: den, eyes: closed, camera: slow push-in, action: "asleep, typing on the phone with the free paw"}
    ua: "Добрий день… А медку не буде? Я тільки ложечку…"
    de: "Guten Tag… Gibt es vielleicht Honig? Oder ein Schlückchen Met? Nur einen Löffel…"

  - shot: {scene: hut, camera: phone close-up, action: "three messages pop in fast, one buzz each"}
    onscreen:
      ua: ["ложечку", "пів ложечки", "хоч понюхати"]
      de: ["einen Löffel", "einen halben", "nur mal riechen"]
    sfx: phone-buzz x3

  - who: pylyp
    shot: {scene: hut, camera: close-up, action: "deadpan to camera"}
    ua: "Сплячка до квітня. Він мені так пів року писатиме."
    de: "Winterschlaf bis April. So schreibt er mir ein halbes Jahr."

  - who: bzynka
    shot: {scene: hut, camera: monitor, action: "pops up on the laptop screen in her visor"}
    ua: "Автоматизуй."
    de: "Automatisier das."

  - who: pylyp
    shot: {scene: hut, camera: over-the-shoulder, action: "fast typing montage, code lines fly, a green deploy tick"}
    ua: "Провидіння саме підказує, що робити. Беруся за автоматизацію."
    de: "Die Vorsehung zeigt mir selbst den Weg. Ich mache mich an die Automatisierung."
    note: "Never a bare \"I'll automate\": the situation itself calls for automation (Volodymyr, 2026-11-25)"
    sfx: keyboard

  - shot: {scene: den, eyes: closed, camera: phone close-up, action: "bot reply arrives in Medunko's phone"}
    onscreen:
      ua: "Дякуємо за інтерес до нашого меду. Ми зберегли ваш запит для майбутніх сезонів."
      de: "Vielen Dank für Ihr Interesse an unserem Honig. Wir haben Ihre Anfrage für zukünftige Saisons gespeichert."

  - who: medunko
    shot: {scene: den, eyes: closed, camera: close-up, action: "smiles in his sleep, hugs the phone"}
    ua: "О… Як з Джобцентру. Значить, шанс є."
    de: "Oh… Wie vom Jobcenter. Dann gibt es noch Hoffnung."

  - who: pylyp
    shot: {scene: hut, camera: medium, action: "lies back on the pillow, closes the laptop with one finger, pulls up the blanket"}
    ua: "Пів року листування за п'ять хвилин. Рутину — ботові, мені — сон."
    de: "Ein halbes Jahr Briefwechsel in fünf Minuten. Die Routine dem Bot, mir den Schlaf."

end_card:
  ua: "Цей мультик зібрав мій власний пайплайн: Python · TTS · Remotion. Рутину беру на себе, вам лишаю квітуче поле."
  de: "Diesen Cartoon hat meine eigene Pipeline gebaut: Python · TTS · Remotion. Die Routine übernehme ich, Ihnen bleibt das blühende Feld."
