name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest -q

  animation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animation/package-lock.json
      - run: npm ci
      - run: npm run lint
